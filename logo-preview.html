<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logo Preview - CA</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: #1a1a1a;
            font-family: 'Arial', sans-serif;
        }
        .container {
            text-align: center;
            background: #0a0a0a;
            padding: 40px;
            border-radius: 14px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }
        h1 {
            color: white;
            margin: 0 0 30px 0;
            font-size: 24px;
        }
        .logo-box {
            width: 500px;
            height: 350px;
            background: #BFFF00;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 30px;
            box-shadow: 0 8px 24px rgba(191, 255, 0, 0.3);
        }
        .info {
            color: #BFFF00;
            font-size: 12px;
            margin-top: 20px;
            font-family: 'Courier New', monospace;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎨 Logo Preview CA</h1>
        <div class="logo-box">
            <svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
              <!-- Letra C - GRANDE -->
              <text x="30" y="180" fontFamily="Arial Black, sans-serif" fontWeight="900" fontSize="160" fill="#000000">C</text>
              
              <!-- Primeira linha branca diagonal -->
              <line x1="190" y1="60" x2="170" y2="240" stroke="white" strokeWidth="18" strokeLinecap="round"/>
              
              <!-- Segunda linha branca diagonal -->
              <line x1="220" y1="60" x2="200" y2="240" stroke="white" strokeWidth="18" strokeLinecap="round"/>
              
              <!-- Letra A - Menor -->
              <text x="240" y="180" fontFamily="Arial Black, sans-serif" fontWeight="900" fontSize="120" fill="#000000">A</text>
            </svg>
        </div>
        <div class="info">
            <p>✓ C e A em PRETO (#000000)</p>
            <p>✓ Duas linhas brancas diagonais</p>
            <p>✓ Fundo VERDE NEON (#BFFF00)</p>
        </div>
    </div>
</body>
</html>
